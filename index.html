  <style>
    :root {
      /* Palette Vibrant / Cyber-EdTech 2026 Enrichie en Couleurs */
      --bg: #f4f6fc;
      --bg-mesh-1: rgba(99, 102, 241, 0.18);   /* Indigo royal */
      --bg-mesh-2: rgba(236, 72, 153, 0.16);   /* Rose néon */
      --bg-mesh-3: rgba(6, 182, 212, 0.18);    /* Cyan lagon */
      --bg-mesh-4: rgba(245, 158, 11, 0.14);   /* Or ambré */
      --bg-mesh-5: rgba(16, 185, 129, 0.15);   /* Émeraude */
      --c: rgba(255, 255, 255, 0.92);
      --c-solid: #ffffff;
      --header-bg: rgba(255, 255, 255, 0.88);
      --t: #0f172a;
      --t-dim: #334155;
      --m: #64748b;
      --a: #6366f1;
      --a-hover: #4f46e5;
      --a-subtle: rgba(99, 102, 241, 0.12);
      --a-glow: rgba(99, 102, 241, 0.45);

      /* Gradients Multicolores & Percutants */
      --grad-primary: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
      --grad-secondary: linear-gradient(135deg, #0284c7 0%, #06b6d4 50%, #3b82f6 100%);
      --grad-accent: linear-gradient(135deg, #f59e0b 0%, #ef4444 100%);
      --grad-success: linear-gradient(135deg, #10b981 0%, #06b6d4 100%);
      --grad-aurora: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #06b6d4 100%);
      --grad-emerald: linear-gradient(135deg, #059669 0%, #10b981 50%, #34d399 100%);
      --grad-sunset: linear-gradient(135deg, #e11d48 0%, #f43f5e 50%, #fb923c 100%);
      --grad-amber: linear-gradient(135deg, #d97706 0%, #f59e0b 50%, #fbbf24 100%);
      --grad-violet: linear-gradient(135deg, #7c3aed 0%, #a855f7 50%, #d946ef 100%);
      --grad-cyber: linear-gradient(135deg, #ec4899 0%, #f43f5e 50%, #f59e0b 100%);

      /* Couleurs signatures par matière */
      --col-pc: #8b5cf6;
      --col-m: #0284c7;
      --col-svt: #10b981;
      --col-en: #f43f5e;
      --col-ph: #a855f7;
      --col-fr: #3b82f6;
      --col-ar: #f59e0b;
      --col-ei: #14b8a6;
      --col-concours: #06b6d4;
      --col-qcm: #ec4899;
      --col-profs: #ef4444;

      --b: rgba(226, 232, 240, 0.9);
      --b-hover: rgba(99, 102, 241, 0.45);
      --ok: #10b981;
      --warn: #f59e0b;
      --danger: #ef4444;
      --card-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.06), 0 8px 10px -6px rgba(99, 102, 241, 0.05);
      --card-hover-shadow: 0 20px 35px -8px rgba(99, 102, 241, 0.22), 0 4px 15px rgba(236, 72, 153, 0.1);
      --font: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #070914;
        --bg-mesh-1: rgba(139, 92, 246, 0.26);  /* Violet néon */
        --bg-mesh-2: rgba(236, 72, 153, 0.22);  /* Fuchsia intense */
        --bg-mesh-3: rgba(6, 182, 212, 0.24);   /* Cyan glowing */
        --bg-mesh-4: rgba(245, 158, 11, 0.18);  /* Or néon */
        --bg-mesh-5: rgba(16, 185, 129, 0.20);  /* Émeraude */
        --c: rgba(15, 20, 36, 0.88);
        --c-solid: #0d1222;
        --header-bg: rgba(7, 9, 20, 0.88);
        --t: #f8fafc;
        --t-dim: #cbd5e1;
        --m: #94a3b8;
        --a: #818cf8;
        --a-hover: #a5b4fc;
        --a-subtle: rgba(129, 140, 248, 0.22);
        --a-glow: rgba(129, 140, 248, 0.55);

        --grad-primary: linear-gradient(135deg, #818cf8 0%, #c084fc 50%, #f472b6 100%);
        --grad-secondary: linear-gradient(135deg, #22d3ee 0%, #60a5fa 50%, #818cf8 100%);
        --grad-accent: linear-gradient(135deg, #fbbf24 0%, #f87171 100%);
        --grad-success: linear-gradient(135deg, #34d399 0%, #22d3ee 100%);
        --grad-aurora: linear-gradient(135deg, #38bdf8 0%, #818cf8 50%, #c084fc 100%);
        --grad-emerald: linear-gradient(135deg, #34d399 0%, #2dd4bf 50%, #38bdf8 100%);
        --grad-sunset: linear-gradient(135deg, #fb7185 0%, #f43f5e 100%);
        --grad-amber: linear-gradient(135deg, #fbbf24 0%, #f59e0b 50%, #f97316 100%);
        --grad-violet: linear-gradient(135deg, #c084fc 0%, #a855f7 50%, #f472b6 100%);
        --grad-cyber: linear-gradient(135deg, #fb7185 0%, #f472b6 50%, #fbbf24 100%);

        --col-pc: #a78bfa;
        --col-m: #38bdf8;
        --col-svt: #34d399;
        --col-en: #fb7185;
        --col-ph: #c084fc;
        --col-fr: #60a5fa;
        --col-ar: #fbbf24;
        --col-ei: #2dd4bf;
        --col-concours: #22d3ee;
        --col-qcm: #f472b6;
        --col-profs: #f87171;

        --b: rgba(255, 255, 255, 0.12);
        --b-hover: rgba(129, 140, 248, 0.55);
        --ok: #34d399;
        --warn: #fbbf24;
        --danger: #f87171;
        --card-shadow: 0 12px 30px -10px rgba(0, 0, 0, 0.7);
        --card-hover-shadow: 0 20px 45px -10px rgba(139, 92, 246, 0.4), 0 0 25px rgba(236, 72, 153, 0.22);
      }
    }
    :root[data-theme="dark"] {
      --bg: #070914;
      --bg-mesh-1: rgba(139, 92, 246, 0.26);  /* Violet néon */
      --bg-mesh-2: rgba(236, 72, 153, 0.22);  /* Fuchsia intense */
      --bg-mesh-3: rgba(6, 182, 212, 0.24);   /* Cyan glowing */
      --bg-mesh-4: rgba(245, 158, 11, 0.18);  /* Or néon */
      --bg-mesh-5: rgba(16, 185, 129, 0.20);  /* Émeraude */
      --c: rgba(15, 20, 36, 0.88);
      --c-solid: #0d1222;
      --header-bg: rgba(7, 9, 20, 0.88);
      --t: #f8fafc;
      --t-dim: #cbd5e1;
      --m: #94a3b8;
      --a: #818cf8;
      --a-hover: #a5b4fc;
      --a-subtle: rgba(129, 140, 248, 0.22);
      --a-glow: rgba(129, 140, 248, 0.55);

      --grad-primary: linear-gradient(135deg, #818cf8 0%, #c084fc 50%, #f472b6 100%);
      --grad-secondary: linear-gradient(135deg, #22d3ee 0%, #60a5fa 50%, #818cf8 100%);
      --grad-accent: linear-gradient(135deg, #fbbf24 0%, #f87171 100%);
      --grad-success: linear-gradient(135deg, #34d399 0%, #22d3ee 100%);
      --grad-aurora: linear-gradient(135deg, #38bdf8 0%, #818cf8 50%, #c084fc 100%);
      --grad-emerald: linear-gradient(135deg, #34d399 0%, #2dd4bf 50%, #38bdf8 100%);
      --grad-sunset: linear-gradient(135deg, #fb7185 0%, #f43f5e 100%);
      --grad-amber: linear-gradient(135deg, #fbbf24 0%, #f59e0b 50%, #f97316 100%);
      --grad-violet: linear-gradient(135deg, #c084fc 0%, #a855f7 50%, #f472b6 100%);
      --grad-cyber: linear-gradient(135deg, #fb7185 0%, #f472b6 50%, #fbbf24 100%);

      --col-pc: #a78bfa;
      --col-m: #38bdf8;
      --col-svt: #34d399;
      --col-en: #fb7185;
      --col-ph: #c084fc;
      --col-fr: #60a5fa;
      --col-ar: #fbbf24;
      --col-ei: #2dd4bf;
      --col-concours: #22d3ee;
      --col-qcm: #f472b6;
      --col-profs: #f87171;

      --b: rgba(255, 255, 255, 0.12);
      --b-hover: rgba(129, 140, 248, 0.55);
      --ok: #34d399;
      --warn: #fbbf24;
      --danger: #f87171;
      --card-shadow: 0 12px 30px -10px rgba(0, 0, 0, 0.7);
      --card-hover-shadow: 0 20px 45px -10px rgba(139, 92, 246, 0.4), 0 0 25px rgba(236, 72, 153, 0.22);
    }

    *, *::before, *::after { box-sizing: border-box; }
    ::selection { background: rgba(99, 102, 241, 0.35); color: #fff; }
    body {
      margin: 0;
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 12% 15%, var(--bg-mesh-1) 0%, transparent 45%),
        radial-gradient(circle at 88% 12%, var(--bg-mesh-3) 0%, transparent 40%),
        radial-gradient(circle at 50% 50%, var(--bg-mesh-2) 0%, transparent 45%),
        radial-gradient(circle at 85% 85%, var(--bg-mesh-4) 0%, transparent 40%),
        radial-gradient(circle at 15% 85%, var(--bg-mesh-5) 0%, transparent 40%);
      background-attachment: fixed;
      color: var(--t);
      font: 14.5px/1.6 var(--font);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* HEADER */
    header {
      background: var(--header-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--b);
      position: sticky;
      top: 0;
      z-index: 50;
      padding: 12px 18px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
      transition: all 0.25s ease;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: inherit;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .brand:hover { transform: scale(1.02); }
    .brand h1 {
      font-size: 19px;
      font-weight: 900;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      letter-spacing: -0.4px;
      background: linear-gradient(135deg, #6366f1 0%, #d946ef 35%, #06b6d4 70%, #10b981 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .tag-sp {
      background: var(--grad-primary);
      color: #fff;
      font-size: 10.5px;
      font-weight: 800;
      padding: 3px 10px;
      border-radius: 9999px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 14px rgba(236, 72, 153, 0.45);
      animation: gentleFloat 4s ease-in-out infinite;
    }
    .badge-biof {
      display: inline-block;
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.12), rgba(6, 182, 212, 0.12));
      color: var(--a);
      border: 1px solid var(--b-hover);
      font-size: 10.5px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 8px;
      vertical-align: middle;
      margin-left: 6px;
      letter-spacing: 0.3px;
    }
    .top-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .btn-icon {
      padding: 7px 13px;
      border-radius: 12px;
      border: 1.5px solid var(--b);
      background: var(--c);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: var(--t);
      cursor: pointer;
      font-size: 12.5px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
    }
    .btn-icon:hover {
      border-color: var(--a);
      color: var(--a);
      transform: translateY(-2px);
      box-shadow: 0 4px 14px var(--a-subtle);
    }
    .btn-icon:active { transform: scale(0.95); }
    .btn-install {
      background: var(--grad-success);
      color: #fff;
      border: none;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35);
      animation: pulse 2s infinite;
    }
    .btn-install:hover { color: #fff; box-shadow: 0 6px 18px rgba(16, 185, 129, 0.5); }

    .row-search {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }
    select, input {
      padding: 9px 14px;
      border: 1.5px solid var(--b);
      border-radius: 12px;
      background: var(--c);
      color: var(--t);
      font: inherit;
      outline: none;
      transition: all 0.2s ease;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
    }
    select:focus, input:focus {
      border-color: var(--a);
      box-shadow: 0 0 0 4px var(--a-subtle);
    }
    .search-wrap {
      flex: 1;
      min-width: 200px;
      position: relative;
    }
    .search-wrap input {
      width: 100%;
      padding-right: 32px;
      padding-left: 14px;
    }
    .search-clear {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--m);
      cursor: pointer;
      font-size: 14px;
      display: none;
      transition: color 0.15s;
    }
    .search-clear:hover { color: var(--danger); }

    /* COUNTDOWN BANNER COLORÉE */
    .cd-banner {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.1) 0%, rgba(236, 72, 153, 0.08) 50%, rgba(6, 182, 212, 0.1) 100%);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1.5px solid var(--b-hover);
      padding: 12px 22px;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .cd-title {
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--t);
      letter-spacing: -0.2px;
    }
    .cd-boxes {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .cd-unit {
      background: var(--c);
      border: 1.5px solid var(--b-hover);
      border-radius: 12px;
      padding: 5px 11px;
      text-align: center;
      min-width: 48px;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.08);
      transition: transform 0.25s, border-color 0.25s, box-shadow 0.25s;
    }
    .cd-unit:hover {
      transform: translateY(-3px) scale(1.05);
      border-color: var(--a);
      box-shadow: 0 6px 18px var(--a-glow);
    }
    .cd-val {
      font-weight: 900;
      font-size: 17px;
      background: var(--grad-primary);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: block;
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
    }
    .cd-lbl {
      font-size: 9.5px;
      text-transform: uppercase;
      color: var(--m);
      font-weight: 800;
      letter-spacing: 0.6px;
    }

    /* NAVIGATION TABS COLORÉE */
    .tabs-wrapper {
      background: var(--header-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1.5px solid var(--b);
      position: sticky;
      top: 61px;
      z-index: 40;
    }
    .tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 10px 18px;
      scrollbar-width: none;
      -ms-overflow-style: none;
      max-width: 1200px;
      margin: 0 auto;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      white-space: nowrap;
      padding: 8px 16px;
      border-radius: 9999px;
      border: 1.5px solid var(--b);
      background: var(--c);
      color: var(--t-dim);
      cursor: pointer;
      font: inherit;
      font-weight: 700;
      font-size: 13px;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
    }
    .tab:hover {
      border-color: var(--a);
      color: var(--a);
      transform: translateY(-2px);
      box-shadow: 0 4px 14px var(--a-subtle);
    }
    .tab.on {
      background: var(--grad-primary);
      color: #ffffff !important;
      border-color: transparent;
      box-shadow: 0 6px 20px rgba(168, 85, 247, 0.45);
      transform: translateY(-2px);
    }
    /* Couleurs spécifiques par matière quand l'onglet est actif */
    .tab.on[data-k="pc"] { background: var(--grad-aurora); box-shadow: 0 6px 20px rgba(79, 70, 229, 0.45); }
    .tab.on[data-k="m"] { background: var(--grad-secondary); box-shadow: 0 6px 20px rgba(2, 132, 199, 0.45); }
    .tab.on[data-k="svt"] { background: var(--grad-emerald); box-shadow: 0 6px 20px rgba(16, 185, 129, 0.45); }
    .tab.on[data-k="en"] { background: var(--grad-sunset); box-shadow: 0 6px 20px rgba(225, 29, 72, 0.45); }
    .tab.on[data-k="ph"] { background: var(--grad-violet); box-shadow: 0 6px 20px rgba(168, 85, 247, 0.45); }
    .tab.on[data-k="fr"] { background: linear-gradient(135deg, #2563eb, #38bdf8); box-shadow: 0 6px 20px rgba(37, 99, 235, 0.45); }
    .tab.on[data-k="ar"] { background: var(--grad-amber); box-shadow: 0 6px 20px rgba(217, 119, 6, 0.45); }
    .tab.on[data-k="ei"] { background: linear-gradient(135deg, #0d9488, #10b981); box-shadow: 0 6px 20px rgba(13, 148, 136, 0.45); }
    .tab.on[data-k="cadre"] { background: linear-gradient(135deg, #8b5cf6, #ec4899); box-shadow: 0 6px 20px rgba(139, 92, 246, 0.45); }
    .tab.on[data-k="concours"] { background: linear-gradient(135deg, #06b6d4, #3b82f6); box-shadow: 0 6px 20px rgba(6, 182, 212, 0.45); }
    .tab.on[data-k="profs"] { background: linear-gradient(135deg, #ef4444, #f97316); box-shadow: 0 6px 20px rgba(239, 68, 68, 0.45); }
    .tab.on[data-k="qcm"] { background: linear-gradient(135deg, #ec4899, #8b5cf6); box-shadow: 0 6px 20px rgba(236, 72, 153, 0.45); }
    .tab.on[data-k="pomo"] { background: var(--grad-accent); box-shadow: 0 6px 20px rgba(245, 158, 11, 0.45); }
    .tab.on[data-k="stats"] { background: linear-gradient(135deg, #10b981, #06b6d4, #6366f1); box-shadow: 0 6px 20px rgba(16, 185, 129, 0.45); }
    .tab:active { transform: scale(0.96); }

    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 18px 80px;
    }

    .sub-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
    }
    .sub-group { display: flex; gap: 8px; flex-wrap: wrap; }
    .sub-group .tab { padding: 6px 14px; font-size: 12.5px; border-radius: 12px; }

    /* PROGRESS BAR MULTICOLORE */
    .progress-box {
      background: var(--c);
      backdrop-filter: blur(16px);
      border: 1.5px solid var(--b);
      border-radius: 18px;
      padding: 16px 20px;
      margin-bottom: 20px;
      box-shadow: var(--card-shadow);
      transition: border-color 0.2s;
    }
    .progress-box:hover { border-color: var(--b-hover); }
    .progress-header {
      display: flex;
      justify-content: space-between;
      font-size: 13.5px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .bar {
      height: 12px;
      background: var(--b);
      border-radius: 9999px;
      overflow: hidden;
      position: relative;
    }
    .bar i {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, #6366f1 0%, #a855f7 35%, #ec4899 70%, #06b6d4 100%);
      border-radius: 9999px;
      transition: width 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 0 14px var(--a-glow);
    }

    /* GRID & CARDS AVEC ACCENTS COLORÉS */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
    }
    .card {
      background: var(--c);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1.5px solid var(--b);
      border-radius: 20px;
      padding: 20px;
      box-shadow: var(--card-shadow);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; height: 3.5px;
      background: linear-gradient(90deg, #6366f1, #a855f7, #ec4899, #06b6d4);
      opacity: 0.85;
      transition: all 0.25s ease;
    }
    .card:hover {
      transform: translateY(-4px) scale(1.01);
      border-color: var(--b-hover);
      box-shadow: var(--card-hover-shadow);
    }
    .card:hover::before {
      height: 5px;
      opacity: 1;
    }
    .card.done {
      border-color: rgba(16, 185, 129, 0.55);
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.08), rgba(6, 182, 212, 0.05));
    }
    .card.done::before {
      background: var(--grad-success);
      opacity: 1;
    }
    .card-top {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 10px;
    }
    .card-chk {
      flex: none;
      width: 20px;
      height: 20px;
      cursor: pointer;
      accent-color: var(--ok);
      margin-top: 3px;
      border-radius: 6px;
      transition: transform 0.15s ease;
    }
    .card-chk:hover { transform: scale(1.15); }
    .card-titles { flex: 1; }
    .card h3 {
      margin: 2px 0 0;
      font-size: 15.5px;
      font-weight: 800;
      line-height: 1.4;
      letter-spacing: -0.2px;
    }
    .card .ar {
      direction: rtl;
      text-align: right;
      display: block;
      color: var(--m);
      font-size: 14px;
      line-height: 1.4;
      margin-top: 4px;
    }
    .card.done h3, .card.done .ar {
      text-decoration: line-through;
      opacity: 0.65;
    }

    .lk {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 14px;
    }
    .lk a, .lk button {
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 10px;
      background: var(--bg);
      border: 1.5px solid var(--b);
      color: var(--a);
      text-decoration: none;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .lk a:hover, .lk button:hover {
      background: var(--a);
      color: #fff !important;
      border-color: var(--a);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px var(--a-subtle);
    }
    .btn-memo {
      background: var(--a-subtle) !important;
      color: var(--a) !important;
      border-color: var(--b-hover) !important;
    }
    .btn-memo:hover {
      background: var(--grad-primary) !important;
      color: #fff !important;
      border-color: transparent !important;
    }
    .yt {
      background: rgba(239, 68, 68, 0.08) !important;
      color: #ef4444 !important;
      border-color: rgba(239, 68, 68, 0.25) !important;
    }
    .yt:hover {
      background: linear-gradient(135deg, #ef4444, #dc2626) !important;
      color: #fff !important;
      border-color: transparent !important;
      box-shadow: 0 4px 14px rgba(239, 68, 68, 0.4) !important;
    }

    .note {
      font-size: 13.5px;
      color: var(--t-dim);
      background: linear-gradient(135deg, var(--c) 0%, rgba(99, 102, 241, 0.05) 100%);
      backdrop-filter: blur(12px);
      border: 1.5px dashed var(--b-hover);
      border-left: 4px solid var(--a);
      padding: 16px 18px;
      border-radius: 16px;
      margin: 18px 0;
      line-height: 1.6;
      box-shadow: var(--card-shadow);
    }
    h2 {
      font-size: 18px;
      font-weight: 900;
      margin: 28px 0 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      letter-spacing: -0.3px;
    }

    /* TABLES COLORÉES */
    .tw {
      overflow-x: auto;
      border-radius: 16px;
      border: 1.5px solid var(--b-hover);
      margin: 16px 0;
      box-shadow: var(--card-shadow);
      background: var(--c);
      backdrop-filter: blur(16px);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: center;
      font-size: 13.5px;
    }
    th {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.08) 0%, rgba(6, 182, 212, 0.06) 100%);
      font-weight: 800;
      padding: 12px 14px;
      border-bottom: 2px solid var(--b-hover);
      color: var(--t);
      letter-spacing: 0.3px;
    }
    td {
      padding: 10px 14px;
      border-bottom: 1px solid var(--b);
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: linear-gradient(90deg, rgba(99, 102, 241, 0.08), rgba(236, 72, 153, 0.05)); }

    /* FORMULA MEMO BOX IN CARD / MODAL */
    .memo-modal-body {
      max-height: 75vh;
      overflow-y: auto;
      padding-right: 8px;
    }
    .memo-section {
      background: var(--bg);
      border: 1px solid var(--b);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.02);
    }
    .memo-title {
      font-size: 14px;
      font-weight: 800;
      color: var(--a);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .formula-badge {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.06) 0%, rgba(6, 182, 212, 0.06) 100%);
      border: 1px solid var(--b-hover);
      border-left: 4px solid var(--a);
      padding: 10px 14px;
      margin: 8px 0;
      border-radius: 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13.5px;
      font-weight: 700;
      color: var(--t);
      box-shadow: 0 3px 10px rgba(99, 102, 241, 0.05);
    }
    .piege-box {
      border-left-color: var(--danger);
      background: rgba(239, 68, 68, 0.08);
      color: var(--danger);
      font-weight: 700;
    }

    /* SIMULATOR CARD COLORÉE */
    .sim-card {
      background: linear-gradient(135deg, var(--c) 0%, rgba(99, 102, 241, 0.05) 50%, rgba(236, 72, 153, 0.04) 100%);
      backdrop-filter: blur(16px);
      border: 2px solid var(--b-hover);
      border-radius: 22px;
      padding: 24px;
      box-shadow: 0 12px 30px rgba(99, 102, 241, 0.12);
      margin-top: 18px;
    }
    .sim-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 14px;
      margin-bottom: 20px;
    }
    .sim-item label {
      display: block;
      font-size: 12.5px;
      font-weight: 800;
      color: var(--m);
      margin-bottom: 6px;
    }
    .sim-item input {
      width: 100%;
    }
    .sim-result {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.14) 0%, rgba(236, 72, 153, 0.1) 50%, rgba(16, 185, 129, 0.12) 100%);
      border: 2px solid var(--b-hover);
      border-radius: 20px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(99, 102, 241, 0.14);
    }
    .sim-score {
      font-size: 38px;
      font-weight: 900;
      background: linear-gradient(135deg, #6366f1 0%, #ec4899 50%, #06b6d4 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 6px 0;
    }
    .sim-mention {
      font-size: 17px;
      font-weight: 800;
      color: var(--ok);
    }

    /* POMODORO VIEW COLORÉE */
    .pomo-container {
      max-width: 520px;
      margin: 24px auto;
      background: linear-gradient(135deg, var(--c) 0%, rgba(245, 158, 11, 0.06) 50%, rgba(239, 68, 68, 0.05) 100%);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 2px solid rgba(245, 158, 11, 0.4);
      border-radius: 24px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 14px 35px rgba(245, 158, 11, 0.18);
    }
    .pomo-modes {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 24px;
    }
    .pomo-modes button {
      padding: 8px 16px;
      border-radius: 9999px;
      border: 1.5px solid var(--b);
      background: var(--bg);
      color: var(--t-dim);
      font-weight: 800;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .pomo-modes button:hover {
      border-color: var(--a);
      transform: translateY(-2px);
    }
    .pomo-modes button.on {
      background: var(--grad-accent);
      color: #fff;
      border-color: transparent;
      box-shadow: 0 4px 14px rgba(245, 158, 11, 0.45);
      transform: translateY(-2px);
    }
    .pomo-display {
      font-size: 74px;
      font-weight: 900;
      letter-spacing: 3px;
      margin: 20px 0;
      font-variant-numeric: tabular-nums;
      background: linear-gradient(135deg, #f59e0b 0%, #ef4444 50%, #ec4899 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .pomo-controls {
      display: flex;
      gap: 14px;
      justify-content: center;
      margin-bottom: 20px;
    }
    .btn-main {
      padding: 12px 28px;
      border-radius: 14px;
      border: none;
      background: var(--grad-primary);
      color: #fff;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.35);
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .btn-main:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 8px 25px rgba(236, 72, 153, 0.45);
    }
    .btn-main:active { transform: scale(0.96); }
    .btn-sec {
      padding: 10px 18px;
      border-radius: 12px;
      border: 1.5px solid var(--b);
      background: var(--bg);
      color: var(--t);
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .btn-sec:hover {
      border-color: var(--a);
      color: var(--a);
      transform: translateY(-2px);
    }
    .btn-sec:active { transform: scale(0.96); }

    /* QCM IA VIEW & PLAYER COLORÉE */
    .qcm-hero {
      background: linear-gradient(135deg, rgba(168, 85, 247, 0.15) 0%, rgba(236, 72, 153, 0.12) 50%, rgba(6, 182, 212, 0.14) 100%);
      border: 2px solid var(--b-hover);
      border-radius: 22px;
      padding: 26px;
      margin-bottom: 24px;
      box-shadow: 0 12px 30px rgba(168, 85, 247, 0.15);
      position: relative;
      overflow: hidden;
    }
    .qcm-dropzone {
      border: 2.5px dashed var(--col-qcm);
      border-radius: 20px;
      padding: 36px 24px;
      text-align: center;
      background: linear-gradient(135deg, var(--c) 0%, rgba(236, 72, 153, 0.04) 100%);
      backdrop-filter: blur(12px);
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      margin: 20px 0;
      box-shadow: var(--card-shadow);
    }
    .qcm-dropzone:hover, .qcm-dropzone.dragover {
      background: var(--a-subtle);
      border-color: var(--a-hover);
      transform: translateY(-4px) scale(1.01);
      box-shadow: var(--card-hover-shadow);
    }
    .qcm-exam-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 16px;
      margin: 20px 0;
    }
    .qcm-exam-card {
      background: var(--c);
      backdrop-filter: blur(16px);
      border: 1.5px solid var(--b);
      border-radius: 18px;
      padding: 18px;
      box-shadow: var(--card-shadow);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 14px;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .qcm-exam-card:hover {
      transform: translateY(-4px);
      border-color: var(--a);
      box-shadow: var(--card-hover-shadow);
    }
    .qcm-quiz-box {
      max-width: 840px;
      margin: 0 auto;
      background: var(--c);
      backdrop-filter: blur(20px);
      border: 1.5px solid var(--b);
      border-radius: 24px;
      padding: 28px;
      box-shadow: var(--card-hover-shadow);
    }
    .qcm-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .qcm-stat-badge {
      background: var(--bg);
      border: 1.5px solid var(--b);
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
    }
    .qcm-question-card {
      margin-top: 14px;
    }
    .qcm-q-num {
      font-size: 12px;
      font-weight: 800;
      color: var(--a);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 8px;
    }
    .qcm-q-text {
      font-size: 17px;
      font-weight: 800;
      line-height: 1.5;
      margin: 0 0 24px 0;
    }
    .qcm-options-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }
    .qcm-opt-btn {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      text-align: left;
      padding: 14px 18px;
      border-radius: 16px;
      border: 2px solid var(--b);
      background: var(--c);
      backdrop-filter: blur(12px);
      color: var(--t);
      font-size: 14.5px;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
    }
    .qcm-opt-btn:hover:not(.disabled) {
      border-color: var(--a);
      background: var(--a-subtle);
      transform: translateX(6px);
      box-shadow: 0 4px 14px var(--a-subtle);
    }
    .qcm-opt-letter {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: var(--bg);
      border: 1.5px solid var(--b);
      font-weight: 900;
      font-size: 13.5px;
      flex-shrink: 0;
      transition: all 0.2s ease;
    }
    .qcm-opt-label {
      flex: 1;
      font-weight: 600;
    }
    .qcm-opt-btn.correct {
      border-color: var(--ok) !important;
      background: rgba(16, 185, 129, 0.14) !important;
      color: var(--ok) !important;
      font-weight: 800;
      box-shadow: 0 4px 16px rgba(16, 185, 129, 0.25) !important;
    }
    .qcm-opt-btn.correct .qcm-opt-letter {
      background: var(--ok);
      color: #fff;
      border-color: var(--ok);
    }
    .qcm-opt-btn.incorrect {
      border-color: var(--danger) !important;
      background: rgba(239, 68, 68, 0.12) !important;
      color: var(--danger) !important;
      font-weight: 800;
    }
    .qcm-opt-btn.incorrect .qcm-opt-letter {
      background: var(--danger);
      color: #fff;
      border-color: var(--danger);
    }
    .qcm-opt-btn.disabled {
      cursor: default;
    }
    .qcm-explanation-box {
      background: var(--bg);
      border: 1.5px solid var(--b);
      border-left: 4px solid var(--a);
      border-radius: 16px;
      padding: 18px;
      margin: 20px 0;
      animation: fadeIn 0.3s ease;
      box-shadow: var(--card-shadow);
    }
    .qcm-exp-title {
      font-size: 13.5px;
      font-weight: 800;
      margin-bottom: 8px;
    }
    .qcm-exp-content {
      font-size: 14px;
      line-height: 1.6;
      color: var(--t);
    }
    .qcm-result-card {
      max-width: 680px;
      margin: 0 auto;
      text-align: center;
      background: var(--c);
      backdrop-filter: blur(20px);
      border: 1.5px solid var(--b);
      border-radius: 24px;
      padding: 36px 24px;
      box-shadow: var(--card-hover-shadow);
    }
    .qcm-score-circle {
      background: linear-gradient(135deg, var(--a-subtle), rgba(16, 185, 129, 0.12));
      border: 1.5px solid var(--b-hover);
      border-radius: 20px;
      padding: 24px;
      margin: 24px auto;
      max-width: 340px;
      box-shadow: 0 4px 20px rgba(99, 102, 241, 0.15);
    }
    .qcm-score-number {
      font-size: 48px;
      font-weight: 900;
      background: var(--grad-primary);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.1;
    }
    .qcm-mention-badge {
      display: inline-block;
      font-size: 16px;
      font-weight: 900;
      padding: 8px 20px;
      border-radius: 9999px;
      border: 2px solid;
      margin-top: 14px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.06);
    }
    .qcm-api-box {
      background: var(--c);
      backdrop-filter: blur(12px);
      border: 1.5px solid var(--b);
      border-radius: 16px;
      padding: 16px;
      margin-top: 16px;
      font-size: 13.5px;
      box-shadow: var(--card-shadow);
    }

    /* STATS DASHBOARD */
    .stats-card {
      background: var(--c);
      backdrop-filter: blur(16px);
      border: 1.5px solid var(--b);
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: var(--card-shadow);
    }
    .subject-row {
      display: grid;
      grid-template-columns: 220px 1fr 100px;
      align-items: center;
      gap: 14px;
      padding: 10px 0;
      border-bottom: 1px solid var(--b);
    }
    .subject-row:last-child { border-bottom: none; }
    .subject-name {
      font-weight: 700;
      font-size: 13.5px;
    }
    .subject-bar .bar {
      height: 8px;
    }
    .subject-count {
      text-align: right;
      font-weight: 800;
      font-size: 12.5px;
      color: var(--m);
    }
    @media (max-width: 600px) {
      .subject-row {
        grid-template-columns: 1fr 60px;
        gap: 6px;
      }
      .subject-bar {
        grid-column: 1 / -1;
      }
    }

    /* MODAL */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(9, 13, 22, 0.65);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      animation: fadeIn 0.2s ease;
    }
    .modal {
      background: var(--c-solid);
      border: 1.5px solid var(--b-hover);
      border-radius: 22px;
      max-width: 600px;
      width: 100%;
      padding: 24px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
      animation: modalPop 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .modal h3 {
      margin-top: 0;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: -0.3px;
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }

    /* ANIMATIONS */
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes modalPop {
      from { opacity: 0; transform: scale(0.92); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes gentleFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-2px); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.92; transform: scale(1.04); }
    }

      background: rgba(37, 211, 102, 0.12) !important;
      border-color: rgba(37, 211, 102, 0.45) !important;

      border-color: #25d366 !important;

    }

    }
    .wa-float-btn:hover {

      background: linear-gradient(135deg, #2bf075 0%, #149c8d 100%);
    }
    .wa-float-btn:active {

function playBeep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(587.33, ctx.currentTime);
    osc.frequency.setValueAtTime(880, ctx.currentTime + 0.15);
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.6);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.6);
  } catch(e) {}
  if ("vibrate" in navigator) navigator.vibrate([200, 100, 200]);
}

function updatePomoDisplay() {
  const m = String(Math.floor(pomoTimeLeft / 60)).padStart(2, '0');
  const s = String(pomoTimeLeft % 60).padStart(2, '0');
  const str = `${m}:${s}`;
  $("#pomo-mini").textContent = str;
  const bigDisp = document.getElementById("pomo-big-disp");
  if (bigDisp) bigDisp.textContent = str;
}

function startPomo() {
  if (pomoRunning) return;
  pomoRunning = true;
  pomoTimer = setInterval(() => {
    if (pomoTimeLeft > 0) {
      pomoTimeLeft--;
      updatePomoDisplay();
    } else {
      clearInterval(pomoTimer);
      pomoRunning = false;
      playBeep();
      if (pomoMode === "focus") {
        pomoCountToday++;
        st("pomo_count_" + new Date().toISOString().slice(0,10), pomoCountToday);
        alert("🎉 Bravo ! Session Pomodoro terminée. Prenez 5 minutes de pause.");
        setPomoMode("break");
      } else {
        alert("🔔 La pause est finie ! C'est l'heure de replonger dans vos révisions.");
        setPomoMode("focus");
      }
      render();
    }
  }, 1000);
  const btnStart = document.getElementById("pomo-btn-start");
  if (btnStart) btnStart.textContent = "⏸️ Pause";
}

function pausePomo() {
  clearInterval(pomoTimer);
  pomoRunning = false;
  const btnStart = document.getElementById("pomo-btn-start");
  if (btnStart) btnStart.textContent = "▶️ Reprendre";
}

function resetPomo() {
  pausePomo();
  if (pomoMode === "focus") pomoTimeLeft = 25 * 60;
  else if (pomoMode === "break") pomoTimeLeft = 5 * 60;
  else pomoTimeLeft = 15 * 60;
  updatePomoDisplay();
  const btnStart = document.getElementById("pomo-btn-start");
  if (btnStart) btnStart.textContent = "▶️ Démarrer";
}

function setPomoMode(mode) {
  pomoMode = mode;
  resetPomo();
  if (cur === "pomo") render();
}

// SIMULATOR CALCULATION
function calcSimScore() {
  const r = parseFloat($("#sim-reg").value) || 0;
  const cc = parseFloat($("#sim-cc").value) || 0;
  const pc = parseFloat($("#sim-pc").value) || 0;
  const m = parseFloat($("#sim-m").value) || 0;
  const svt = parseFloat($("#sim-svt").value) || 0;
  const en = parseFloat($("#sim-en").value) || 0;
  const ph = parseFloat($("#sim-ph").value) || 0;

  // National total coeff = 7 + 7 + 5 + 2 + 2 = 23
  const natScore = (pc * 7 + m * 7 + svt * 5 + en * 2 + ph * 2) / 23;
  // Bac final = 25% Régional + 25% CC + 50% National
  const total = (r * 0.25) + (cc * 0.25) + (natScore * 0.50);

  const totalEl = $("#sim-total");
  const natEl = $("#sim-nat");
  const mentionEl = $("#sim-mention");

  if (totalEl) totalEl.textContent = total.toFixed(2) + " / 20";
  if (natEl) natEl.textContent = natScore.toFixed(2) + " / 20";

  let mention = "Ajourné (Rattrapage)";
  let color = "var(--danger)";
  if (total >= 16) { mention = "Mention Très Bien 🎖️"; color = "var(--ok)"; }
  else if (total >= 14) { mention = "Mention Bien 🥈"; color = "var(--a)"; }
  else if (total >= 12) { mention = "Mention Assez Bien 🥉"; color = "var(--warn)"; }
  else if (total >= 10) { mention = "Mention Passable 👍"; color = "var(--t)"; }

  if (mentionEl) {
    mentionEl.textContent = mention;
    mentionEl.style.color = color;
  }
}

// CALCULATEUR DU SCORE DE PRÉSÉLECTION CONCOURS POST-BAC (CURSUSSUP MAROC)
function calcConcoursScore() {
  const regEl = $("#concours-reg");
  const natEl = $("#concours-nat");
  const reg = parseFloat(regEl ? regEl.value : 14) || 0;
  const nat = parseFloat(natEl ? natEl.value : 15) || 0;

  // Formule officielle CursusSup : 75% Examen National + 25% Examen Régional
  const score = (nat * 0.75) + (reg * 0.25);

  const scoreEl = $("#concours-score");
  if (scoreEl) scoreEl.textContent = score.toFixed(2) + " / 20";

  // Mettre à jour en temps réel l'admissibilité pour chaque école
  CONCOURS_LIST.forEach((ecole, idx) => {
    const badgeEl = document.getElementById(`concours-badge-${idx}`);
    if (!badgeEl) return;
    if (score >= ecole.seuil) {
      badgeEl.innerHTML = `<span style="color:var(--ok); font-weight:800; background:rgba(16,185,129,0.14); padding:4px 10px; border-radius:8px; display:inline-block">🟢 Admissible au concours écrit (${ecole.seuil.toFixed(2)})</span>`;
    } else if (score >= ecole.seuil - 0.75) {
      badgeEl.innerHTML = `<span style="color:var(--warn); font-weight:800; background:rgba(245,158,11,0.14); padding:4px 10px; border-radius:8px; display:inline-block">🟡 Seuil très proche (${ecole.seuil.toFixed(2)})</span>`;
    } else {
      badgeEl.innerHTML = `<span style="color:var(--danger); font-weight:700; background:rgba(239,68,68,0.1); padding:4px 10px; border-radius:8px; display:inline-block">🔴 Sous le seuil indicatif (${ecole.seuil.toFixed(2)})</span>`;
    }
  });
}

// EVENTS HANDLING
document.addEventListener("click", e => {
  const t = e.target.closest("[data-k],[data-s],[data-f]");
  if (!t) return;
  if (t.dataset.k) {
    navigateTab(t.dataset.k);
  } else if (t.dataset.s) {
    sem = +t.dataset.s;
    st("sem", sem);
    render();
  } else if (t.dataset.f) {
    filterStatus = t.dataset.f;
    st("filter_status", filterStatus);
    render();
  }
});

document.addEventListener("change", e => {
  const d = e.target.dataset.d;
  if (d) {
    done[d] = e.target.checked;
    st("done", JSON.stringify(done));
    render();
  }
});

// SEARCH BAR
const inputQ = $("#q");
const clearQ = $("#q-clear");
inputQ.oninput = () => {
  clearQ.style.display = inputQ.value ? "block" : "none";
  render();
};
clearQ.onclick = () => {
  inputQ.value = "";
  clearQ.style.display = "none";
  render();
};

// FILIERE SELECTOR
$("#fil").value = fil;
$("#fil").onchange = e => {
  fil = e.target.value;
  st("fil", fil);
  render();
};

// SETTINGS & BACKUP MODAL
const modal = $("#modal-settings");
$("#btn-settings").onclick = () => modal.style.display = "flex";
$("#modal-close").onclick = () => modal.style.display = "none";
modal.onclick = e => { if (e.target === modal) modal.style.display = "none"; };

// EXPORT JSON
$("#btn-export").onclick = () => {
  const data = {
    version: "2026.2",
    exportDate: new Date().toISOString(),
    fil,
    done,
    pomoCountToday
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `progression_bac_sp_2026_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
};

// IMPORT JSON
$("#file-import").onchange = e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const parsed = JSON.parse(ev.target.result);
      if (parsed.done && typeof parsed.done === "object") {
        done = { ...done, ...parsed.done };
        st("done", JSON.stringify(done));
        if (parsed.fil) { fil = parsed.fil; st("fil", fil); $("#fil").value = fil; }
        alert("✅ Progression importée avec succès !");
        modal.style.display = "none";
        render();
      } else {
        alert("❌ Fichier de sauvegarde invalide.");
      }
    } catch(err) {
      alert("❌ Erreur lors de la lecture du fichier JSON.");
    }
  };
  reader.readAsText(file);
};

// RESET
$("#btn-reset").onclick = () => {
  if (confirm("⚠️ Êtes-vous sûr de vouloir réinitialiser toute votre progression de révision ?")) {
    done = {};
    st("done", JSON.stringify(done));
    modal.style.display = "none";
    render();
  }
};

// QCM IA & PDF HELPERS
function setupDropzone() {
  const dz = document.getElementById("qcm-drop-zone");
  if (!dz) return;
  dz.ondragover = e => { e.preventDefault(); dz.classList.add("dragover"); };
  dz.ondragleave = e => { e.preventDefault(); dz.classList.remove("dragover"); };
  dz.ondrop = e => {
    e.preventDefault();
    dz.classList.remove("dragover");
    if (e.dataTransfer.files && e.dataTransfer.files[0]) {
      processUploadedPdf(e.dataTransfer.files[0]);
    }
  };
}

function handlePdfUpload(e) {
  if (e.target.files && e.target.files[0]) {
    processUploadedPdf(e.target.files[0]);
  }
}

async function processUploadedPdf(file) {
  if (!file.name.toLowerCase().endsWith('.pdf')) {
    alert("Veuillez sélectionner un fichier au format PDF.");
    return;
  }

  const statusEl = document.getElementById("qcm-upload-status");
  const msgEl = document.getElementById("qcm-status-msg");
  const barEl = document.getElementById("qcm-status-bar");
  if (statusEl) statusEl.style.display = "block";

  try {
    if (msgEl) msgEl.textContent = `Lecture et extraction de "${file.name}"...`;
    if (barEl) barEl.style.width = "40%";

    const extractedText = await extractTextFromPdf(file, (page, total) => {
      if (msgEl) msgEl.textContent = `Extraction des pages : ${page} / ${total}...`;
      if (barEl) barEl.style.width = `${Math.round((page / total) * 50)}%`;
    });

    if (msgEl) msgEl.textContent = "Génération du QCM pédagogique par l'IA...";
    if (barEl) barEl.style.width = "75%";

    let questions = [];
    const apiKey = localStorage.getItem("gemini_api_key");

    if (apiKey && apiKey.trim().length > 10) {
      try {
        questions = await generateQuestionsWithGemini(extractedText, apiKey.trim());
      } catch (geminiErr) {
        console.warn("Échec Gemini, repli sur le moteur hors-ligne :", geminiErr);
        questions = generateQuestionsFromKeywords(extractedText, file.name);
      }
    } else {
      questions = generateQuestionsFromKeywords(extractedText, file.name);
    }

    if (barEl) barEl.style.width = "100%";
    if (statusEl) statusEl.style.display = "none";

    const customQuiz = {
      id: "custom_" + Date.now(),
      title: "QCM IA : " + file.name.replace(".pdf", ""),
      subject: "Document Personnel",
      matiereKey: "custom",
      pdfPath: "",
      questions: questions
    };

    startQuiz(customQuiz);
  } catch (err) {
    if (statusEl) statusEl.style.display = "none";
    alert("Erreur lors de la conversion du PDF : " + err.message);
  }
}

async function convertLocalPdfToQcm(pdfUrl, title) {
  navigateTab('qcm');
  const statusEl = document.getElementById("qcm-upload-status");
  const msgEl = document.getElementById("qcm-status-msg");
  const barEl = document.getElementById("qcm-status-bar");
  if (statusEl) statusEl.style.display = "block";

  try {
    if (msgEl) msgEl.textContent = `Extraction du fichier "${title || pdfUrl}"...`;
    if (barEl) barEl.style.width = "40%";

    const extractedText = await extractTextFromPdf(pdfUrl, (page, total) => {
      if (msgEl) msgEl.textContent = `Extraction des pages : ${page} / ${total}...`;
      if (barEl) barEl.style.width = `${Math.round((page / total) * 60)}%`;
    });

    if (msgEl) msgEl.textContent = "Génération du QCM par l'IA...";
    if (barEl) barEl.style.width = "85%";

    let questions = [];
    const apiKey = localStorage.getItem("gemini_api_key");
    if (apiKey && apiKey.trim().length > 10) {
      try {
        questions = await generateQuestionsWithGemini(extractedText, apiKey.trim());
      } catch (err) {
        questions = generateQuestionsFromKeywords(extractedText, pdfUrl);
      }
    } else {
      questions = generateQuestionsFromKeywords(extractedText, pdfUrl);
    }

    if (statusEl) statusEl.style.display = "none";
    startQuiz({
      id: "auto_" + Date.now(),
      title: "QCM IA : " + (title || "Examen"),
      subject: "Examen Officiel",
      matiereKey: "custom",
      pdfPath: pdfUrl,
      questions: questions
    });
  } catch (err) {
    if (statusEl) statusEl.style.display = "none";
    alert("Impossible de convertir ce PDF : " + err.message);
  }
}

function saveGeminiKey() {
  const input = document.getElementById("gemini-key-input");
  if (input) {
    const val = input.value.trim();
    if (val) {
      localStorage.setItem("gemini_api_key", val);
      alert("✅ Clé API Google Gemini enregistrée avec succès !");
    } else {
      localStorage.removeItem("gemini_api_key");
      alert("Clé API effacée. Le moteur hors-ligne sera utilisé.");
    }
  }
}

// INITIAL RENDER
render();
